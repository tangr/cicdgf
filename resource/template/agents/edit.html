<!DOCTYPE html>
<html>
<head>
    <title>{{.agent_name|shortName}} - CICD</title>

    {{include "base_head.html" .}}

</head>
<body>

<div class="ui container maincontainer">

    {{include "base_menu.html" .}}

    <div class="ui breadcrumb">
      <a class="section" href="{{.url|urlParentPath}}">Home</a>
      <div class="divider"> / </div>
      <a class="section" href="{{.url}}">Agents</a>
      <div class="divider"> / </div>
      <div class="active section">{{.agent_name|shortName}}</div>
    </div>

    <div class="ui divider"></div>

<form class="ui form" method="POST" action="{{.apiurl}}" id="agent_id">

  <div class="field">
    <label>Agent Name</label>
    <input type="text" name="agent_name" value="{{ .agent_name }}" id="agent_name" placeholder="Agent Name" required="required" autocomplete="off">
  </div>
  <div class="field">
    <label>Agent IpAddr</label>
    <input type="text" name="agent_ipaddr" value="{{ .agent_ipaddr }}" id="agent_ipaddr" placeholder="Agent IpAddr" required="required" autocomplete="off">
  </div>

  <button class="ui button" type="submit" id="agent_save">Submit</button>
</form>

</div>

{{include "base_foot.html" .}}

<script type="text/javascript">
    $('.ui.dropdown').dropdown();

</script>


</body>
</html>
